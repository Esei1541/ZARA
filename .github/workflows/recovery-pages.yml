name: Recovery Pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: recovery-pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - run: node --test site/tests/*.test.mjs
      - uses: actions/configure-pages@v6
      - name: Stage recovery page
        run: |
          mkdir -p _pages/recovery
          cp site/index.html site/style.css site/recovery.mjs _pages/recovery/
          touch _pages/.nojekyll
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _pages
      - id: deployment
        uses: actions/deploy-pages@v5
